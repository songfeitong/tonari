[project]
name = "tonari"
version = "0.1.0"
description = "Neighbor search for NumPy and PyTorch on CPU and CUDA"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "numpy>=2.0",
  "torch==2.12.1",
]

[build-system]
requires = [
  "setuptools>=77",
  "torch==2.12.1",
]
build-backend = "setuptools.build_meta"

[dependency-groups]
data = [
  "pyarrow==25.0.0",
]
dev = [
  "ase==3.29.0",
  "pytest==9.1.1",
  "ruff",
  "vesin==0.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA device and the compiled extension",
  "benchmark: performance benchmark, excluded from the default test run",
]

[tool.ruff]
target-version = "py312"
