[project]
name = "tonari"
version = "0.1.0"
description = "Neighbor search for NumPy and PyTorch on CPU and CUDA"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
torch = ["torch==2.12.1"]

[build-system]
requires = [
  "numpy>=2.0",
  "pybind11>=3.0",
  "setuptools>=77",
  "torch==2.12.1",
]
build-backend = "setuptools.build_meta"

[dependency-groups]
data = [
  "pyarrow==25.0.0",
]
dev = [
  "ase==3.29.0",
  "pytest==9.1.1",
  "ruff",
  "torch==2.12.1",
  "vesin==0.6.1",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA device and the compiled extension",
  "benchmark: performance benchmark, excluded from the default test run",
]

[tool.ruff]
target-version = "py311"

[tool.setuptools.package-data]
tonari = ["py.typed"]
