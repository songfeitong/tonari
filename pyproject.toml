[project]
name = "tonari"
version = "0.1.0"
description = "Neighbor search for NumPy and PyTorch on CPU and CUDA"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.0",
  "torch==2.12.1",
]

[build-system]
requires = [
  "pybind11>=3.0",
  "scikit-build-core>=1.0",
  "torch==2.12.1",
]
build-backend = "scikit_build_core.build"

[dependency-groups]
data = [
  "pyarrow==25.0.0",
]
dev = [
  "ase==3.29.0",
  "mypy",
  "pytest==9.1.1",
  "ruff",
  "vesin==0.6.1",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA device and the compiled extension",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
strict = true

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/tonari"]
