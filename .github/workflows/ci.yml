name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_CUDA: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Check lock file
        if: matrix.python-version == '3.12'
        run: uv lock --check

      - name: Run Ruff
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check src tests benchmarks scripts
          uv run ruff format --check src tests benchmarks scripts

      - name: Build reusable CMake core
        if: matrix.python-version == '3.12'
        run: |
          cmake -S . -B build/core -G Ninja -DTONARI_BUILD_PYTHON=OFF
          cmake --build build/core

      - name: Build and install CPU wheel
        if: matrix.python-version == '3.12'
        run: |
          uv build --wheel --out-dir dist/ci
          uv run --no-project python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist/ci").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert any(name.startswith("tonari/_numpy_cpu.") for name in names)
              assert any(name.startswith("tonari/_torch_cpu.") for name in names)
              assert not any(name.startswith("tonari/_torch_cuda.") for name in names)
              build_info = archive.read("tonari/_build_info.py").decode()
              assert "BUILD_WITH_CUDA = False" in build_info
          PY
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/ci/*.whl
          .venv/bin/python -c "from tonari import _extensions; _extensions.load_numpy_cpu(); _extensions.load_torch_cpu()"

      - name: Run mypy
        if: matrix.python-version == '3.12'
        run: uv run --no-sync mypy src tests/typecheck_api.py

      - name: Check Markdown formatting
        if: matrix.python-version == '3.12'
        run: npx --yes prettier@3.8.3 --check --prose-wrap never '**/*.md'

      - name: Run tests
        run: uv run --no-sync pytest -q -m "not cuda"

  cuda:
    name: CUDA
    if: vars.TONARI_CUDA_RUNNER == 'true'
    runs-on:
      - self-hosted
      - linux
      - x64
      - cuda
    timeout-minutes: 45
    env:
      BUILD_CUDA: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --group dev --python 3.12

      - name: Run tests
        run: uv run pytest -q
