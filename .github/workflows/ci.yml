name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Check lock file
        if: matrix.python-version == '3.12'
        run: uv lock --check

      - name: Run Ruff
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check src tests benchmarks scripts setup.py
          uv run ruff format --check src tests benchmarks scripts setup.py

      - name: Check Markdown formatting
        if: matrix.python-version == '3.12'
        run: npx --yes prettier@3.8.3 --check --prose-wrap never '**/*.md'

      - name: Run tests
        run: uv run pytest -q
